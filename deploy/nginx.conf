# nginx: portmzl.ru — основной (канонический), portmzl.com → 301 на portmzl.ru.
# Приложение (контейнер) слушает 127.0.0.1:4321.
# Один сертификат на все имена — см. DEPLOY.md:
#   certbot --nginx -d portmzl.ru -d www.portmzl.ru -d portmzl.com -d www.portmzl.com
# Файл кладётся в /etc/nginx/sites-available/portmzl.ru и линкуется в sites-enabled.

# 1) HTTP → HTTPS для всех имён (+ ACME для выпуска/продления сертификата)
server {
    listen 80;
    listen [::]:80;
    server_name portmzl.ru www.portmzl.ru portmzl.com www.portmzl.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# 2) portmzl.com, www.portmzl.com и www.portmzl.ru → 301 на канонический https://portmzl.ru
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.portmzl.ru portmzl.com www.portmzl.com;

    ssl_certificate     /etc/letsencrypt/live/portmzl.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portmzl.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://portmzl.ru$request_uri;
}

# 3) Канонический portmzl.ru — проксирование в приложение
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portmzl.ru;

    ssl_certificate     /etc/letsencrypt/live/portmzl.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portmzl.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Сжатие
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Долгий кэш для неизменяемых ассетов (шрифты, картинки, видео, OG, _astro)
    location ~* ^/(fonts|_astro|og|people|hero|licenses|cases|video)/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    client_max_body_size 1m;
}
