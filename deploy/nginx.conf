# nginx для kaskad03.online → контейнер на 127.0.0.1:4321.
# Положить в /etc/nginx/sites-available/kaskad03.online и слинковать в sites-enabled.
# Сертификаты выпускает certbot (см. DEPLOY.md) — он же допишет 443-блок; ниже готовый вариант.

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name kaskad03.online www.kaskad03.online;

    # Для выпуска/продления сертификата Let's Encrypt
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kaskad03.online www.kaskad03.online;

    ssl_certificate     /etc/letsencrypt/live/kaskad03.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaskad03.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Сжатие
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Долгий кэш для неизменяемых ассетов (шрифты, OG, _astro)
    location ~* ^/(fonts|_astro|og|people)/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    client_max_body_size 1m;
}
